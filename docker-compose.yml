services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: performance_investigation
      # Mesma codificação e locale do Postgres embarcado (ver
      # scripts/postgres-embarcado.js): o locale muda planos de execução.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    ports:
      - '5432:5432'
    volumes:
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -h 127.0.0.1']
      interval: 5s
      timeout: 5s
      retries: 10
      # Na primeira subida, os scripts de sql/ geram o volume de dados
      # (uns 20 a 40 s). Falhas durante esse período não contam como
      # tentativa.
      start_period: 120s
